name: GEYA GPS8-10 smart circuit breaker
products:
  - id: flv5ms
    manufacturer: GEYA
    model: GPS8-10
# Relay (DP 16)
entities:
  - entity: switch
    name: Breaker
    icon: "mdi:electric-switch"
    dps:
      - id: 16
        type: boolean
        name: switch

  # DP 6 (phase_a): raw, 8 bytes, big-endian
  #   bytes 0-1: voltage, 0.1 V
  #   bytes 2-4: current, 0.001 A
  #   bytes 5-7: active power, 0.001 kW (= 1 W)
  - entity: sensor
    name: Voltage
    class: voltage
    dps:
      - id: 6
        type: base64
        optional: true
        name: sensor
        unit: V
        class: measurement
        mask: "FFFF000000000000"
        mapping:
          - scale: 10
  - entity: sensor
    name: Current
    class: current
    dps:
      - id: 6
        type: base64
        optional: true
        name: sensor
        unit: A
        class: measurement
        mask: "0000FFFFFF000000"
        mapping:
          - scale: 1000
  - entity: sensor
    name: Power
    class: power
    dps:
      - id: 6
        type: base64
        optional: true
        name: sensor
        unit: W
        class: measurement
        mask: "0000000000FFFFFF"
  # DP 1: forward total energy, scale 2
  - entity: sensor
    name: Energy
    class: energy
    dps:
      - id: 1
        type: integer
        optional: true
        name: sensor
        unit: kWh
        class: total_increasing
        mapping:
          - scale: 100
  # DP 2: leakage current, mA
  - entity: sensor
    name: Leakage current
    class: current
    dps:
      - id: 2
        type: integer
        optional: true
        name: sensor
        unit: mA
        class: measurement
  # DP 9: fault bitmap (bit N = label N)
  - entity: binary_sensor
    name: Fault
    class: problem
    category: diagnostic
    dps:
      - id: 9
        type: bitfield
        name: sensor
        optional: true
        mapping:
          - dps_val: 0
            value: false
          - dps_val: null
            value: false
          - value: true
  - entity: binary_sensor
    name: Short circuit
    class: problem
    category: diagnostic
    dps:
      - id: 9
        type: bitfield
        name: sensor
        optional: true
        mapping:
          - dps_val: 1
            value: true
          - value: false
  - entity: binary_sensor
    name: Surge
    class: problem
    category: diagnostic
    dps:
      - id: 9
        type: bitfield
        name: sensor
        optional: true
        mapping:
          - dps_val: 2
            value: true
          - value: false
  - entity: binary_sensor
    name: Overload
    class: problem
    category: diagnostic
    dps:
      - id: 9
        type: bitfield
        name: sensor
        optional: true
        mapping:
          - dps_val: 4
            value: true
          - value: false
  - entity: binary_sensor
    name: Leakage current alarm
    class: problem
    category: diagnostic
    dps:
      - id: 9
        type: bitfield
        name: sensor
        optional: true
        mapping:
          - dps_val: 8
            value: true
          - value: false
  - entity: binary_sensor
    name: Temperature difference fault
    class: problem
    category: diagnostic
    dps:
      - id: 9
        type: bitfield
        name: sensor
        optional: true
        mapping:
          - dps_val: 16
            value: true
          - value: false
  - entity: binary_sensor
    name: Fire alarm
    class: problem
    category: diagnostic
    dps:
      - id: 9
        type: bitfield
        name: sensor
        optional: true
        mapping:
          - dps_val: 32
            value: true
          - value: false
  - entity: binary_sensor
    name: High power
    class: problem
    category: diagnostic
    dps:
      - id: 9
        type: bitfield
        name: sensor
        optional: true
        mapping:
          - dps_val: 64
            value: true
          - value: false
  - entity: binary_sensor
    name: Self test fault
    class: problem
    category: diagnostic
    dps:
      - id: 9
        type: bitfield
        name: sensor
        optional: true
        mapping:
          - dps_val: 128
            value: true
          - value: false
  - entity: binary_sensor
    name: Overcurrent
    class: problem
    category: diagnostic
    dps:
      - id: 9
        type: bitfield
        name: sensor
        optional: true
        mapping:
          - dps_val: 256
            value: true
          - value: false
  - entity: binary_sensor
    name: Unbalance
    class: problem
    category: diagnostic
    dps:
      - id: 9
        type: bitfield
        name: sensor
        optional: true
        mapping:
          - dps_val: 512
            value: true
          - value: false
  - entity: binary_sensor
    name: Overvoltage
    class: problem
    category: diagnostic
    dps:
      - id: 9
        type: bitfield
        name: sensor
        optional: true
        mapping:
          - dps_val: 1024
            value: true
          - value: false
  - entity: binary_sensor
    name: Undervoltage
    class: problem
    category: diagnostic
    dps:
      - id: 9
        type: bitfield
        name: sensor
        optional: true
        mapping:
          - dps_val: 2048
            value: true
          - value: false
  - entity: binary_sensor
    name: Phase loss
    class: problem
    category: diagnostic
    dps:
      - id: 9
        type: bitfield
        name: sensor
        optional: true
        mapping:
          - dps_val: 4096
            value: true
          - value: false
  - entity: binary_sensor
    name: Power outage
    class: problem
    category: diagnostic
    dps:
      - id: 9
        type: bitfield
        name: sensor
        optional: true
        mapping:
          - dps_val: 8192
            value: true
          - value: false
  - entity: binary_sensor
    name: Magnetism alarm
    class: problem
    category: diagnostic
    dps:
      - id: 9
        type: bitfield
        name: sensor
        optional: true
        mapping:
          - dps_val: 16384
            value: true
          - value: false
  - entity: binary_sensor
    name: Credit alarm
    class: problem
    category: diagnostic
    dps:
      - id: 9
        type: bitfield
        name: sensor
        optional: true
        mapping:
          - dps_val: 32768
            value: true
          - value: false
  - entity: binary_sensor
    name: No balance
    class: problem
    category: diagnostic
    dps:
      - id: 9
        type: bitfield
        name: sensor
        optional: true
        mapping:
          - dps_val: 65536
            value: true
          - value: false

  # ---------------------------------------------------------------
  # Alarm settings (DP 17 / DP 18, raw, big-endian).
  # Each alarm = 4 bytes: [type id][action: 1 = trip, 0 = alarm only][threshold, 2 bytes]
  # DP 17 (alarm_set_1) on this unit, 4 bytes:   04 01 00 32            -> leakage 50 mA
  # DP 18 (alarm_set_2) on this unit, 12 bytes:  01 01 00 28            -> overcurrent 40 A
  #                                              03 01 01 0E            -> overvoltage 270 V
  #                                              04 01 00 8C            -> undervoltage 140 V
  # The byte layout is fixed by what the device reported; if a firmware
  # reports a different set of alarms, the masks must be adjusted.
  # ---------------------------------------------------------------

  # Leakage protection (DP 17, bytes 0-3)
  - entity: switch
    name: Leakage protection trip
    category: config
    icon: "mdi:flash-alert"
    dps:
      - id: 17
        type: base64
        optional: true
        name: switch
        mask: "00FF0000"
        mapping:
          - dps_val: 1
            value: true
          - dps_val: 0
            value: false
  - entity: number
    name: Leakage threshold
    category: config
    icon: "mdi:flash-alert"
    dps:
      - id: 17
        type: base64
        optional: true
        name: value
        mask: "0000FFFF"
        unit: mA
        range:
          min: 10
          max: 400
        mapping:
          - step: 1

  # Over-current (DP 18, alarm #1: bytes 0-3)
  - entity: switch
    name: Overcurrent trip
    category: config
    icon: "mdi:current-ac"
    dps:
      - id: 18
        type: base64
        optional: true
        name: switch
        mask: "00FF00000000000000000000"
        mapping:
          - dps_val: 1
            value: true
          - dps_val: 0
            value: false
  - entity: number
    name: Overcurrent threshold
    category: config
    icon: "mdi:current-ac"
    dps:
      - id: 18
        type: base64
        optional: true
        name: value
        mask: "0000FFFF0000000000000000"
        unit: A
        range:
          min: 1
          max: 80
        mapping:
          - step: 1

  # Over-voltage (DP 18, alarm #2: bytes 4-7)
  - entity: switch
    name: Overvoltage trip
    category: config
    icon: "mdi:sine-wave"
    dps:
      - id: 18
        type: base64
        optional: true
        name: switch
        mask: "0000000000FF000000000000"
        mapping:
          - dps_val: 1
            value: true
          - dps_val: 0
            value: false
  - entity: number
    name: Overvoltage threshold
    category: config
    icon: "mdi:sine-wave"
    dps:
      - id: 18
        type: base64
        optional: true
        name: value
        mask: "000000000000FFFF00000000"
        unit: V
        range:
          min: 230
          max: 300
        mapping:
          - step: 1

  # Under-voltage (DP 18, alarm #3: bytes 8-11)
  - entity: switch
    name: Undervoltage trip
    category: config
    icon: "mdi:sine-wave"
    dps:
      - id: 18
        type: base64
        optional: true
        name: switch
        mask: "000000000000000000FF0000"
        mapping:
          - dps_val: 1
            value: true
          - dps_val: 0
            value: false
  - entity: number
    name: Undervoltage threshold
    category: config
    icon: "mdi:sine-wave"
    dps:
      - id: 18
        type: base64
        optional: true
        name: value
        mask: "00000000000000000000FFFF"
        unit: V
        range:
          min: 140
          max: 210
        mapping:
          - step: 1
